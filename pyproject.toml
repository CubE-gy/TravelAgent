[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "0.1.0"
description = "TravelAgent V1 backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires local PostgreSQL containers configured through .env",
    "amap_smoke: makes a small number of real Amap Web API requests",
    "llm_smoke: makes a real request to the configured OpenAI-compatible LLM Provider",
]
addopts = "-m 'not integration and not amap_smoke and not llm_smoke'"

[tool.setuptools.packages.find]
include = ["app*"]
